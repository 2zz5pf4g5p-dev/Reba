<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reba</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#161616;--field:#101010;--line:#2b2b2b;--ink:#fff;--mute:#a6a6a6;--red:#e11d2e;--red-hi:#ff3b4a;
--display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;--body:"DM Sans","Segoe UI",system-ui,sans-serif;--serif:"Playfair Display",Georgia,serif}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red-hi);outline-offset:2px}

header{position:sticky;top:0;z-index:5;text-align:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{background:none;border:0;cursor:pointer;font:400 38px/1 var(--display);letter-spacing:3px;color:var(--ink);padding:0}
.logo i{color:var(--red);font-style:normal}
.tag{font:italic 600 13px var(--serif);color:var(--mute);margin:2px 0 8px}
.langs{display:flex;justify-content:center;gap:6px;margin:0 0 10px}
.lang{background:transparent;border:1px solid #444;color:var(--mute);border-radius:999px;padding:3px 14px;font:700 12px var(--body);letter-spacing:1px;cursor:pointer}
.lang.on{background:#fff;border-color:#fff;color:#0a0a0a}
.search{width:100%;max-width:520px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:var(--field);text-align:center}
.search:focus{border-color:var(--red);text-align:left}

main{max-width:1100px;margin:0 auto;padding:18px 16px}

.btn{padding:11px 20px;border:2px solid var(--red);border-radius:999px;background:var(--red);color:#fff;font-weight:700;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--red-hi);border-color:var(--red-hi)}
.btn.white{background:#fff;border-color:#fff;color:#0a0a0a}
.btn.ghost{background:transparent;border-color:#fff;color:#fff}
.btn.on{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}

.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:26px;padding:34px 22px 26px;margin-bottom:22px;
background:radial-gradient(120% 90% at 85% 0%,rgba(225,29,46,.45),transparent 62%),radial-gradient(80% 60% at 0% 100%,rgba(225,29,46,.18),transparent 70%),#0d0d0d}
.kicker{display:inline-flex;gap:8px;align-items:center;font:700 12px var(--body);letter-spacing:2.5px;color:#fff;border:1px solid #fff;border-radius:999px;padding:5px 12px}
.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red-hi)}
.hero h1{font:400 clamp(46px,15vw,124px)/.88 var(--display);letter-spacing:1px;margin:16px 0 10px;overflow-wrap:anywhere}
.hero h1.sm{font-size:clamp(36px,11vw,96px)}
.hero h1 span{color:var(--red-hi)}
.hero .quote{font:italic 600 clamp(18px,4.6vw,26px)/1.25 var(--serif);margin:0 0 8px}
.lead{color:var(--mute);max-width:520px;margin:0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 26px}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:14px}
.steps b{display:block;font:400 34px/1 var(--display);color:var(--red-hi)}
.sec{font:400 30px/1 var(--display);letter-spacing:1.5px;margin:6px 0 16px;display:flex;align-items:center;gap:12px}
.sec::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--red),transparent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px 16px}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card video,.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;pointer-events:none;border:1px solid var(--line)}
.thumb{font-size:38px;background:linear-gradient(135deg,#2a0b0f,#0d0d0d 70%)}
.card h3{margin:10px 0 2px;font:700 16px/1.3 var(--body)}
.meta{color:var(--mute);font-size:13px}
.real{color:var(--red-hi);font-size:12px;font-weight:700}
.empty{text-align:center;padding:50px 16px;color:var(--mute)}
.empty h2{font:400 38px var(--display);color:#fff;margin:0}

.watch{display:grid;gap:18px}
@media(min-width:900px){.watch{grid-template-columns:1fr 330px}}
.watch>section>video{width:100%;max-height:70vh;background:#000;border-radius:18px;display:block;border:1px solid var(--line)}
.watch h1{font:400 36px/1.05 var(--display);letter-spacing:1px;margin:14px 0 4px}
.desc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap}
.watch h2{font:400 26px var(--display);letter-spacing:1px}
.cm{display:flex;gap:8px;margin:10px 0}
.c{padding:10px 0;border-bottom:1px solid var(--line)}
.side .card{margin-bottom:14px}
/* Compact video reactions and comments */
.watch .row{gap:7px;margin:9px 0}
.watch .row .btn{padding:6px 12px;border-width:1px;font-size:13px;line-height:1.2}
.watch h2{font-size:22px;margin:14px 0 7px}
.cm{gap:6px;margin:7px 0}
.cm input{padding:8px 11px;border-radius:9px;font-size:14px}
.cm .btn{padding:7px 12px;border-width:1px;font-size:13px}
.c{padding:7px 0;font-size:13px;line-height:1.4}
.c .meta{font-size:11px}

.box{display:grid;gap:12px;max-width:460px;margin:10px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.box h2,h2.t{font:400 34px/1 var(--display);letter-spacing:1px;margin:0}
input[type=text],input[type=password],textarea{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--red)}
input[type=file]{padding:10px;border:1px dashed #555;border-radius:12px;background:var(--field)}
.err{color:var(--red-hi);min-height:1.3em;font-size:14px}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0}
code{background:#000;border:1px solid var(--line);padding:2px 8px;border-radius:8px;font-size:15px;letter-spacing:1px}
h3.t{font:400 28px var(--display);letter-spacing:1px;margin:22px 0 8px}

.bubbles{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px 2px;margin:10px 0}
.b{max-width:84%;padding:9px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--red);border-bottom-right-radius:4px}
.b.them{align-self:flex-start;background:#262626;border-bottom-left-radius:4px}
.b small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.chatrow{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer}
.dot{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font:800 12px/20px var(--body);padding:0 6px;text-align:center;font-style:normal}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:space-around;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(10,10,10,.94);backdrop-filter:blur(12px);border-top:2px solid var(--red)}
.tab{position:relative;flex:1;max-width:130px;background:none;border:0;border-radius:14px;padding:6px 4px;color:var(--mute);font:700 11px var(--body);letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.tab span{display:block;font-size:22px;line-height:1.2;margin-bottom:2px}
.tab.on{color:#fff;background:var(--red)}
.badge{position:absolute;top:0;right:14%;min-width:18px;height:18px;border-radius:9px;background:#fff;color:#0a0a0a;font:800 11px/18px var(--body);padding:0 5px;font-style:normal;letter-spacing:0}
</style>
</head>

<script>
const $ = id => document.getElementById(id), app = $('app');
let me = null, active = 'home', view = { name: 'home' }, poll = null, unread = 0;
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} }
};
const nl = (navigator.language || 'en').slice(0, 2);
let lang = ls.get('reba-lang') || (nl === 'fr' ? 'fr' : (nl === 'rw' || nl === 'rn') ? 'rw' : 'en');
if (!I18N[lang]) lang = 'en';
const t = (k, v) => {
  let s = I18N[lang][k] ?? I18N.en[k] ?? k;
  if (v) for (const x in v) s = s.replace('{' + x + '}', () => v[x]);
  return s;
};
const errText = e => (I18N[lang].errs && I18N[lang].errs[e.message]) || e.message;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = tm => { const m = Math.floor((Date.now() - tm) / 60000); return m < 1 ? t('now') : m < 60 ? t('ago_m', { n: m }) : m < 1440 ? t('ago_h', { n: Math.floor(m / 60) }) : t('ago_d', { n: Math.floor(m / 1440) }); };
const isAdmin = () => me && me.role === 'admin';
const who = o => esc(o.author) + (o.real_name ? ` <span class="real">(${esc(o.real_name)})</span>` : '');

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (opts.json) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const r = await fetch('/api' + path, { ...opts, headers });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
const chatApi = (path, opts = {}) => api(path, { ...opts, headers: { 'x-chat-token': ls.get('reba-chat') || '' } });

const tab = (go, icon, label, badge) => `<button class="tab ${active === go ? 'on' : ''}" data-go="${go}"><span>${icon}</span>${label}${badge ? `<em class="badge">${badge}</em>` : ''}</button>`;
function nav() {
  const n = unread > 0 ? unread : 0;
  $('nav').innerHTML = isAdmin()
    ? tab('home', '🏠', t('t_home')) + tab('upload', '⬆️', t('t_upload')) + tab('admin', '👑', t('t_panel'), n) + tab('logout', '🚪', t('t_logout'))
    : me
      ? tab('home', '🏠', t('t_home')) + tab('upload', '⬆️', t('t_upload')) + tab('chat', '💬', t('t_chat'), n) + tab('logout', '🚪', t('t_logout'))
      : tab('home', '🏠', t('t_home')) + tab('unlock', '🔓', t('t_unlock')) + tab('chat', '💬', t('t_chat'), n);
}
const setActive = a => { active = a; nav(); };

async function checkUnread() {
  try {
    if (isAdmin()) unread = (await api('/admin/unread')).n;
    else if (ls.get('reba-chat')) unread = (await chatApi('/chat/unread')).n;
    else unread = 0;
  } catch {}
  nav();
}

const LANGS = { en: 'English', fr: 'Français', rw: 'Kinyarwanda' };
function applyLang() {
  document.documentElement.lang = lang;
  $('tag').textContent = t('tag');
  $('q').placeholder = t('search');
  $('q').setAttribute('aria-label', t('search'));
  $('langs').innerHTML = Object.keys(LANGS).map(l => `<button class="lang ${l === lang ? 'on' : ''}" data-lang="${l}" aria-label="${LANGS[l]}">${l.toUpperCase()}</button>`).join('');
  nav();
}
function setLang(l) { lang = l; ls.set('reba-lang', l); applyLang(); go(view.name, view.arg, true); }

const card = v => `<button class="card" data-id="${v.id}">${me
  ? `<video src="/stream/${v.id}#t=1" preload="metadata" muted playsinline></video>`
  : '<div class="thumb">🔒</div>'}<h3>${esc(v.title)}</h3><div class="meta">${who(v)} · 👁 ${v.views} · ${ago(v.at)}</div></button>`;

function hero() {
  if (isAdmin()) return `<section class="hero"><span class="kicker">${t('kick_own')}</span><h1 class="sm">${t('o_h1a')}<br><span>${t('o_h1b')}</span></h1><p class="lead">${t('o_lead')}</p><div class="row"><button class="btn" data-go="admin">${t('b_panel')}</button><button class="btn white" data-go="upload">${t('b_up')}</button></div></section>`;
  if (me) return `<section class="hero"><span class="kicker">${t('kick_mem')}</span><h1 class="sm">${t('m_h1')}<br><span>${esc(me.name.toUpperCase())}.</span></h1><p class="lead">${t('m_lead', { name: '<b>' + esc(me.name) + '</b>' })}</p><div class="row"><button class="btn" data-go="upload">${t('b_up')}</button></div></section>`;
  return `<section class="hero"><span class="kicker">${t('kick_in')}</span><h1>${t('h1a')}<br>${t('h1b')}<br><span>${t('h1c')}</span></h1><p class="quote">${t('quote')}</p><p class="lead">${t('lead')}</p><div class="row"><button class="btn" data-go="unlock">${t('b_code')}</button><button class="btn white" data-go="chat">${t('b_ask')}</button></div></section>
  <div class="steps"><div><b>1</b>${t('s1')}</div><div><b>2</b>${t('s2')}</div><div><b>3</b>${t('s3')}</div></div>`;
}

async function home() {
  setActive('home');
  const q = $('q').value;
  const list = await api('/videos?q=' + encodeURIComponent(q));
  app.innerHTML = (q ? '' : hero()) + `<h2 class="sec">${t('latest')}</h2>` +
    (list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty"><h2>${t('none')}</h2></div>`);
}

async function watch(id, noview) {
  setActive('home');
  const [v, all] = await Promise.all([api('/videos/' + id + (noview ? '?noview=1' : '')), api('/videos')]);
  app.innerHTML = `<div class="watch"><section>
    <video src="/stream/${v.id}" controls autoplay playsinline controlsList="nodownload noremoteplayback" disablePictureInPicture oncontextmenu="return false"></video>
    <h1>${esc(v.title)}</h1>
    <div class="meta">${who(v)} · 👁 ${v.views} · ${ago(v.at)}</div>
    <div class="row"><button class="btn ghost ${v.liked ? 'on' : ''}" id="like">♥ ${v.likes}</button>${isAdmin() ? `<button class="btn ghost" id="del">${t('del')}</button>` : ''}</div>
    ${v.descr ? `<div class="desc">${esc(v.descr)}</div>` : ''}
    <h2>${t('comments')} (${v.comments.length})</h2>
    <div class="cm"><input id="ci" type="text" placeholder="${t('c_ph')}" aria-label="${t('c_ph')}"><button class="btn" id="cb">${t('post')}</button></div>
    <div class="err" id="err"></div>
    ${v.comments.map(c => `<div class="c"><b>${who(c)}</b> <span class="meta">${ago(c.at)}</span><br>${esc(c.body)}</div>`).join('')}
  </section><aside class="side">${all.filter(x => x.id !== v.id).map(card).join('')}</aside></div>`;
  const fail = e => $('err').textContent = errText(e);
  $('like').onclick = () => api('/videos/' + id + '/like', { method: 'POST' }).then(r => { $('like').textContent = '♥ ' + r.likes; $('like').classList.toggle('on', r.liked); }).catch(fail);
  $('cb').onclick = () => api('/videos/' + id + '/comments', { method: 'POST', json: { body: $('ci').value } }).then(() => go('watch', id, true)).catch(fail);
  if ($('del')) $('del').onclick = () => confirm(t('del_ok')) && api('/videos/' + id, { method: 'DELETE' }).then(() => go('home'));
}

function unlock(key) {
  setActive('unlock');
  app.innerHTML = `<div class="box"><h2>${t('u_title')}</h2>
    <p class="meta" style="margin:0">${t(key || 'u_lead')}</p>
    <input id="code" type="text" placeholder="XXXXX-XXXXX" aria-label="Code" autocapitalize="characters" autocomplete="off">
    <div class="err" id="err"></div><button class="btn" id="go">${t('u_btn')}</button>
    <button class="link" data-go="chat">${t('u_nocode')}</button></div>`;
  $('go').onclick = () => api('/redeem', { method: 'POST', json: { code: $('code').value } })
    .then(async () => { me = await api('/me'); go('home'); checkUnread(); }).catch(e => $('err').textContent = errText(e));
}

/* ---------- chat (visitor side) ---------- */
const bubbles = (msgs, mine, label) => msgs.map(m => `<div class="b ${m.sender === mine ? 'me' : 'them'}">${esc(m.body)}<small>${label(m)} · ${ago(m.at)}</small></div>`).join('');
const paint = (html) => { const el = $('bubbles'); if (!el) return; const near = el.scrollHeight - el.scrollTop - el.clientHeight < 90; el.innerHTML = html; if (near) el.scrollTop = el.scrollHeight; };

function chatStart() {
  app.innerHTML = `<div class="box"><h2>${t('ch_title')}</h2><p class="meta" style="margin:0">${t('ch_lead')}</p>
    <input id="n" type="text" placeholder="${t('ch_name')}" aria-label="${t('ch_name')}">
    <input id="ct" type="text" placeholder="${t('ch_contact')}" aria-label="${t('ch_contact')}">
    <textarea id="m" rows="4" placeholder="${t('ch_msg')}" aria-label="${t('ch_msg')}"></textarea>
    <div class="err" id="err"></div><button class="btn" id="send">${t('ch_send')}</button>
    <p class="meta" style="margin:0">${t('ch_note')}</p></div>`;
  $('send').onclick = () => api('/chat/start', { method: 'POST', json: { name: $('n').value, contact: $('ct').value, message: $('m').value } })
    .then(r => { ls.set('reba-chat', r.token); go('chat'); }).catch(e => $('err').textContent = errText(e));
}

async function chat() {
  setActive('chat');
  if (!ls.get('reba-chat')) return chatStart();
  let d;
  try { d = await chatApi('/chat?read=1'); }
  catch (e) { if (e.message === 'Chat not found.') { ls.del('reba-chat'); return chatStart(); } throw e; }
  unread = 0; nav();
  const label = m => m.sender === 'owner' ? t('ch_owner') : t('ch_you');
  app.innerHTML = `<h2 class="t">${t('ch_title')}</h2><p class="meta" style="margin:6px 0 0">${t('ch_note')}</p>
    <div class="bubbles" id="bubbles">${bubbles(d.messages, 'visitor', label)}</div>
    <div class="cm"><input id="ci" type="text" placeholder="${t('ch_type')}" aria-label="${t('ch_type')}"><button class="btn" id="cb">${t('ch_send')}</button></div>
    <div class="err" id="err"></div>`;
  $('bubbles').scrollTop = $('bubbles').scrollHeight;
  const refresh = async () => { try { const r = await chatApi('/chat?read=1'); paint(bubbles(r.messages, 'visitor', label)); } catch {} };
  const send = () => { const body = $('ci').value; if (!body.trim()) return; chatApi('/chat/send', { method: 'POST', json: { body } }).then(() => { $('ci').value = ''; $('bubbles').scrollTop = 1e9; return refresh(); }).catch(e => $('err').textContent = errText(e)); };
  $('cb').onclick = send;
  $('ci').onkeydown = e => { if (e.key === 'Enter') send(); };
  poll = setInterval(refresh, 6000);
}

function uploadForm() {
  if (!me) return go('unlock', 'u_first');
  setActive('upload');
  app.innerHTML = `<div class="box"><h2>${t('up_title')}</h2>
    <input id="f" type="file" accept="video/*" aria-label="Video">
    <input id="t" type="text" placeholder="${t('up_t')}" aria-label="${t('up_t')}">
    <input id="d" type="text" placeholder="${t('up_d')}" aria-label="${t('up_d')}">
    <p class="meta" style="margin:0">${t('up_note')}</p>
    <div class="err" id="err"></div><button class="btn" id="go">${t('up_pub')}</button></div>`;
  $('f').onchange = () => { if ($('f').files[0] && !$('t').value) $('t').value = $('f').files[0].name.replace(/\.[^.]+$/, ''); };
  $('go').onclick = async () => {
    const fd = new FormData();
    fd.append('title', $('t').value); fd.append('descr', $('d').value);
    if ($('f').files[0]) fd.append('video', $('f').files[0]);
    $('err').textContent = t('up_ing');
    try { const r = await api('/videos', { method: 'POST', body: fd }); go('watch', r.id); }
    catch (e) { $('err').textContent = errText(e); }
  };
}

/* ---------- owner ---------- */
function adminLogin() {
  setActive('admin');
  app.innerHTML = `<div class="box"><h2>${t('ol_title')}</h2>
    <input id="pw" type="password" placeholder="${t('ol_pw')}" aria-label="${t('ol_pw')}" autocomplete="current-password">
    <div class="err" id="err"></div><button class="btn" id="go">${t('ol_btn')}</button></div>`;
  $('go').onclick = () => api('/admin/login', { method: 'POST', json: { password: $('pw').value } })
    .then(async () => { me = await api('/me'); go('admin'); checkUnread(); }).catch(e => $('err').textContent = errText(e));
}

const chatRows = chats => chats.map(c => `<button class="chatrow" data-chat="${c.id}"><b>${esc(c.name)}</b> ${c.unread ? `<em class="dot">${c.unread}</em>` : ''} <span class="meta">${ago(c.last_at)}</span><br><span class="meta">${esc((c.last_body || '').slice(0, 90))}</span></button>`).join('') || `<p class="meta">${t('p_nochats')}</p>`;

async function adminPanel() {
  if (!isAdmin()) return go('adminlogin');
  setActive('admin');
  const [chats, codes] = await Promise.all([api('/admin/chats'), api('/admin/codes')]);
  app.innerHTML = `<h2 class="t">${t('p_title')}</h2>
    <h3 class="t">${t('p_chats')}</h3>
    <div id="chatlist">${chatRows(chats)}</div>
    <h3 class="t">${t('p_codes')}</h3>
    <div class="cm"><input id="lab" type="text" placeholder="${t('p_who')}" aria-label="${t('p_who')}"><button class="btn" id="mk">${t('p_make')}</button></div>
    <div class="err" id="err"></div>
    ${codes.map(c => `<div class="c"><b>${esc(c.label)}</b> <span class="meta">${t('p_shows', { a: esc(c.alias) })}</span> <code>${esc(c.code)}</code> <span class="meta">${c.claimed_at ? t('p_inuse', { w: ago(c.claimed_at) }) : t('p_unused')}</span><br><button class="btn ghost sm" data-copy="${esc(c.code)}">${t('p_copy')}</button> ${c.claimed_at ? `<button class="btn ghost sm" data-reset="${c.id}">${t('p_reset')}</button> ` : ''}<button class="btn ghost sm" data-rev="${c.id}">${t('p_revoke')}</button></div>`).join('') || `<p class="meta">${t('p_nocodes')}</p>`}`;
  $('mk').onclick = () => api('/admin/codes', { method: 'POST', json: { label: $('lab').value } }).then(() => go('admin', null, true)).catch(e => $('err').textContent = errText(e));
  poll = setInterval(async () => { try { const c = await api('/admin/chats'); const el = $('chatlist'); if (el) el.innerHTML = chatRows(c); checkUnread(); } catch {} }, 8000);
}

async function adminChat(id) {
  if (!isAdmin()) return go('adminlogin');
  setActive('admin');
  const d = await api('/admin/chats/' + id);
  const label = m => m.sender === 'owner' ? t('ch_you') : esc(d.name);
  app.innerHTML = `<button class="link" data-go="admin">← ${t('p_back')}</button>
    <h2 class="t" style="margin-top:10px">${esc(d.name)}</h2>
    ${d.contact ? `<p class="meta" style="margin:4px 0 0">${t('ch_contact_l', { c: esc(d.contact) })}</p>` : ''}
    <div class="bubbles" id="bubbles">${bubbles(d.messages, 'owner', label)}</div>
    <div class="cm"><input id="ci" type="text" placeholder="${t('ch_type')}" aria-label="${t('ch_type')}"><button class="btn" id="cb">${t('ch_send')}</button></div>
    <div class="err" id="err"></div>
    <button class="btn ghost sm" id="delchat">${t('p_delete')}</button>`;
  $('bubbles').scrollTop = $('bubbles').scrollHeight;
  checkUnread();
  const refresh = async () => { try { const r = await api('/admin/chats/' + id); paint(bubbles(r.messages, 'owner', label)); } catch {} };
  const send = () => { const body = $('ci').value; if (!body.trim()) return; api('/admin/chats/' + id + '/reply', { method: 'POST', json: { body } }).then(() => { $('ci').value = ''; $('bubbles').scrollTop = 1e9; return refresh(); }).catch(e => $('err').textContent = errText(e)); };
  $('cb').onclick = send;
  $('ci').onkeydown = e => { if (e.key === 'Enter') send(); };
  $('delchat').onclick = () => confirm(t('p_chatdel_ok')) && api('/admin/chats/' + id, { method: 'DELETE' }).then(() => go('admin'));
  poll = setInterval(refresh, 6000);
}

/* ---------- routing ---------- */
const routes = { home, unlock, chat, upload: uploadForm, adminlogin: adminLogin, admin: adminPanel, adminchat: adminChat, watch };
const showErr = err => { app.innerHTML = '<div class="empty"><p>' + esc(errText(err)) + '</p></div>'; };
function go(name, arg, quiet) {
  clearInterval(poll);
  view = { name, arg };
  if (!quiet) window.scrollTo(0, 0);
  return Promise.resolve(routes[name](arg, quiet)).catch(showErr);
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-go],[data-id],[data-copy],[data-rev],[data-reset],[data-chat],[data-lang]');
  if (!el) return;
  const d = el.dataset;
  try {
    if (d.lang) return setLang(d.lang);
    if (d.id) return me ? go('watch', d.id) : go('unlock', 'u_watch');
    if (d.chat) return go('adminchat', d.chat);
    if (d.copy) { await navigator.clipboard.writeText(d.copy); el.textContent = t('p_copied'); return; }
    if (d.rev) { if (confirm(t('p_revoke_ok'))) { await api('/admin/codes/' + d.rev, { method: 'DELETE' }); go('admin', null, true); } return; }
    if (d.reset) { if (confirm(t('p_reset_ok'))) { await api('/admin/codes/' + d.reset + '/reset', { method: 'POST' }); go('admin', null, true); } return; }
    if (d.go === 'logout') { await api('/logout', { method: 'POST' }); me = null; unread = 0; history.replaceState(null, '', location.pathname); return go('home'); }
    go(d.go);
  } catch (err) { showErr(err); }
});
$('q').oninput = () => go('home', null, true);
const start = () => go(location.hash === '#owner' ? (isAdmin() ? 'admin' : 'adminlogin') : 'home');
window.addEventListener('hashchange', start);
applyLang();
(async () => { try { me = await api('/me'); } catch {} applyLang(); start(); checkUnread(); setInterval(checkUnread, 30000); })();
</script>
</body>
</html>
