<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REBA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand {
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #ef4444;
      font-size: 1.2rem;
      white-space: nowrap;
    }
    input, textarea, button, select {
      font: inherit;
      border-radius: 10px;
      border: 1px solid #27272a;
      background: #141418;
      color: #f4f4f5;
      padding: 10px 12px;
    }
    input[type="search"], input[type="text"], input[type="password"] {
      width: 100%;
    }
    .btn {
      cursor: pointer;
      font-weight: 700;
      border: none;
      text-decoration: none;
      display: inline-block;
    }
    .btn-red {
      background: #dc2626;
      color: #fff;
    }
    .btn-dark {
      background: #18181b;
      color: #f4f4f5;
      border: 1px solid #2e2e36;
    }
    .panel {
      background: #111115;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin: 12px 0;
      flex-wrap: wrap;
    }
    .tab.active {
      background: #dc2626;
      color: #fff;
      border-color: #dc2626;
    }
    .video-card {
      position: relative;
      background: #111115;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .video-stage {
      position: relative;
      margin-top: 8px;
      border-radius: 10px;
      overflow: hidden;
      background: #050507;
      border: 1px solid #232329;
      min-height: 170px;
    }
    video {
      width: 100%;
      display: block;
      background: #000;
    }
    .locked-preview {
      padding: 20px 14px;
      text-align: center;
      background: repeating-linear-gradient(
        -45deg,
        #0d0d11,
        #0d0d11 10px,
        #14141b 10px,
        #14141b 20px
      );
    }
    .lock-layer {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .lock-badge {
      background: rgba(220, 38, 38, 0.16);
      border: 1px solid #ef4444;
      color: #fca5a5;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.05em;
    }
    .contact-link {
      color: #f87171;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .chat-box {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      background: #0b0b0e;
      border: 1px solid #222228;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .msg {
      padding: 8px 10px;
      border-radius: 10px;
      background: #16161c;
      font-size: 0.92rem;
    }
    .msg-meta {
      font-size: 0.76rem;
      color: #a1a1aa;
      margin-bottom: 3px;
    }
    .badge-owner {
      color: #f87171;
      font-weight: 700;
    }
    .muted {
      color: #a1a1aa;
      font-size: 0.88rem;
    }
    .hidden {
      display: none;
    }
    .status-msg {
      font-size: 0.88rem;
      margin-top: 6px;
      color: #fca5a5;
    }
    .ok-msg {
      color: #86efac;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-card {
      width: 100%;
      max-width: 460px;
      background: #111115;
      border: 1px solid #2e2e36;
      border-radius: 14px;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">&#9654; REBA</div>
      <input type="search" id="search-input" placeholder="Search videos" />
    </div>

    <!-- Visitor Access Bar -->
    <div class="panel stack" id="visitor-bar">
      <div class="row">
        <button class="btn btn-red" id="visitor-code-btn" type="button">ENTER ACCESS CODE</button>
        <button class="btn btn-dark" id="visitor-contact-btn" type="button">REQUEST ACCESS CODE</button>
        <button class="btn btn-dark" id="visitor-chat-btn" type="button">CHAT</button>
      </div>
      <div id="access-status-bar" class="muted">Enter an access code to watch videos.</div>
    </div>

    <!-- Visitor Access Code Box -->
    <div class="panel stack hidden" id="code-panel">
      <strong>ACCESS CODE</strong>
      <input type="text" id="access-code-input" placeholder="Enter access code" />
      <div class="row">
        <button class="btn btn-red" id="access-code-submit" type="button">UNLOCK VIDEOS</button>
        <button class="btn btn-dark" id="open-contact-from-code" type="button">REQUEST CODE</button>
      </div>
      <div id="access-code-msg" class="status-msg"></div>
    </div>

    <!-- Private Management Panel (Only shown when ?studio=1 is in URL or already authenticated) -->
    <div class="panel stack hidden" id="studio-section">
      <strong>STUDIO</strong>
      <input type="password" id="studio-pass-input" placeholder="Passkey" autocomplete="current-password" />
      <div class="row">
        <button class="btn btn-red" id="studio-login-submit" type="button">SIGN IN</button>
        <button class="btn btn-dark" id="studio-logout-btn" type="button">SIGN OUT</button>
      </div>
      <div id="studio-login-msg" class="status-msg"></div>

      <hr style="border: 0; border-top: 1px solid #27272a; width: 100%;" />

      <strong>UPLOAD VIDEO</strong>
      <form id="upload-form" class="stack" enctype="multipart/form-data">
        <input type="text" id="upload-title" name="title" placeholder="Video title" required />
        <input type="text" id="upload-desc" name="description" placeholder="Description (optional)" />
        <input type="file" id="upload-file" name="video" accept="video/*" required />
        <button class="btn btn-red" type="submit">UPLOAD VIDEO</button>
      </form>
      <div id="upload-msg" class="status-msg"></div>

      <hr style="border: 0; border-top: 1px solid #27272a; width: 100%;" />

      <strong>ACCESS CODES</strong>
      <div class="row">
        <input type="text" id="new-code-input" placeholder="Custom code or blank for auto" style="flex: 1;" />
        <button class="btn btn-dark" id="create-code-btn" type="button">CREATE CODE</button>
      </div>
      <div id="created-code-msg" class="status-msg ok-msg"></div>
    </div>

    <!-- Video Feed -->
    <div class="tabs">
      <button class="btn btn-dark tab active" data-sort="new" type="button">NEW</button>
      <button class="btn btn-dark tab" data-sort="views" type="button">MOST VIEWED</button>
      <button class="btn btn-dark tab" data-sort="likes" type="button">MOST LIKED</button>
    </div>

    <div id="videos-list">
      <div class="muted">Loading videos...</div>
    </div>

    <!-- In-App Chat -->
    <div class="panel stack" id="chat-panel">
      <div class="row" style="justify-content: space-between;">
        <strong>CHAT</strong>
        <span class="muted" id="chat-sync-label">Live</span>
      </div>
      <div class="chat-box" id="chat-messages">
        <div class="muted">Loading messages...</div>
      </div>
      <form id="chat-form" class="stack">
        <input type="text" id="chat-sender" placeholder="Your name (optional)" />
        <div class="row">
          <input type="text" id="chat-input" placeholder="Ask for an access code..." style="flex: 1;" required />
          <button class="btn btn-red" type="submit">SEND</button>
        </div>
      </form>
      <div id="chat-msg" class="status-msg"></div>
    </div>
  </div>

  <!-- Layered Contact / Request Access Code Modal -->
  <div class="modal-backdrop hidden" id="contact-modal" role="dialog" aria-modal="true">
    <div class="modal-card stack">
      <div class="row" style="justify-content: space-between;">
        <strong>REQUEST ACCESS CODE</strong>
        <button class="btn btn-dark" id="close-contact-modal" type="button">CLOSE</button>
      </div>
      <p class="muted" style="margin: 0;">
        Send a message in chat to ask for an access code.
      </p>
      <div class="row">
        <button class="btn btn-red" id="jump-to-chat-btn" type="button">GO TO CHAT</button>
        <button class="btn btn-dark" id="open-code-from-modal" type="button">ENTER CODE</button>
      </div>
      <form id="quick-request-form" class="stack">
        <input type="text" id="req-name" placeholder="Your name (optional)" />
        <input type="text" id="req-note" placeholder="Hey, can I get an access code?" required />
        <button class="btn btn-red" type="submit">SEND REQUEST</button>
      </form>
      <div id="quick-req-status" class="status-msg"></div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = 'reba_access_token';
    let currentSort = 'new';

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || '';
    }

    function setToken(token) {
      if (token) localStorage.setItem(TOKEN_KEY, token);
      else localStorage.removeItem(TOKEN_KEY);
      updateViewState();
      loadVideos();
    }

    function parseRole(token) {
      if (!token) return null;
      try {
        const part = token.split('.')[1];
        const json = JSON.parse(atob(part.replace(/-/g, '+').replace(/_/g, '/')));
        return json.role || null;
      } catch (e) {
        return null;
      }
    }

    function hasStudioParam() {
      const params = new URLSearchParams(window.location.search);
      return params.get('studio') === '1' || params.get('owner') === '1';
    }

    function updateViewState() {
      const token = getToken();
      const role = parseRole(token);
      const isOwner = role === 'owner';
      const isUnlocked = isOwner || role === 'member';

      const studioSection = document.getElementById('studio-section');
      if (isOwner || hasStudioParam()) {
        studioSection.classList.remove('hidden');
      } else {
        studioSection.classList.add('hidden');
      }

      const statusBar = document.getElementById('access-status-bar');
      if (isOwner) {
        statusBar.textContent = 'Access unlocked.';
      } else if (isUnlocked) {
        statusBar.textContent = 'Access code active — videos unlocked.';
      } else {
        statusBar.textContent = 'Videos require an access code. Tap a video to request one.';
      }
    }

    function openContactModal(videoTitle = '') {
      const modal = document.getElementById('contact-modal');
      const noteInput = document.getElementById('req-note');
      if (videoTitle && !noteInput.value) {
        noteInput.value = `Requesting access code for "${videoTitle}"`;
      }
      modal.classList.remove('hidden');
    }

    function closeContactModal() {
      document.getElementById('contact-modal').classList.add('hidden');
    }

    document.getElementById('visitor-code-btn').addEventListener('click', () => {
      document.getElementById('code-panel').classList.toggle('hidden');
    });

    document.getElementById('visitor-contact-btn').addEventListener('click', () => openContactModal());
    document.getElementById('open-contact-from-code').addEventListener('click', () => openContactModal());
    document.getElementById('close-contact-modal').addEventListener('click', closeContactModal);

    document.getElementById('open-code-from-modal').addEventListener('click', () => {
      closeContactModal();
      const cp = document.getElementById('code-panel');
      cp.classList.remove('hidden');
      cp.scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('jump-to-chat-btn').addEventListener('click', () => {
      closeContactModal();
      document.getElementById('chat-panel').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('visitor-chat-btn').addEventListener('click', () => {
      document.getElementById('chat-panel').scrollIntoView({ behavior: 'smooth' });
    });

    async function sendChatMessage(sender, message) {
      const token = getToken();
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
        },
        body: JSON.stringify({ sender, message }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not send message.');
      await loadChat();
      return data;
    }

    document.getElementById('quick-request-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('quick-req-status');
      const name = document.getElementById('req-name').value.trim() || 'Visitor';
      const note = document.getElementById('req-note').value.trim();
      if (!note) return;
      statusEl.textContent = 'Sending...';
      statusEl.className = 'status-msg';
      try {
        await sendChatMessage(name, note);
        statusEl.textContent = 'Sent!';
        statusEl.className = 'status-msg ok-msg';
        document.getElementById('req-note').value = '';
        setTimeout(() => {
          closeContactModal();
          document.getElementById('chat-panel').scrollIntoView({ behavior: 'smooth' });
        }, 400);
      } catch (err) {
        statusEl.textContent = err.message;
      }
    });

    document.getElementById('studio-login-submit').addEventListener('click', async () => {
      const msgEl = document.getElementById('studio-login-msg');
      const pw = document.getElementById('studio-pass-input').value;
      msgEl.textContent = 'Signing in...';
      msgEl.className = 'status-msg';
      try {
        const res = await fetch('/api/owner/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        const data = await res.json();
        if (!res.ok || !data.token) {
          msgEl.textContent = data.error || 'Sign in failed.';
          return;
        }
        setToken(data.token);
        msgEl.textContent = 'Signed in.';
        msgEl.className = 'status-msg ok-msg';
      } catch (err) {
        msgEl.textContent = 'Connection error.';
      }
    });

    document.getElementById('studio-logout-btn').addEventListener('click', () => {
      setToken('');
      document.getElementById('studio-login-msg').textContent = 'Signed out.';
    });

    document.getElementById('create-code-btn').addEventListener('click', async () => {
      const code = document.getElementById('new-code-input').value.trim();
      const msgEl = document.getElementById('created-code-msg');
      const token = getToken();
      msgEl.textContent = '';
      try {
        const res = await fetch('/api/access-codes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (!res.ok) {
          msgEl.textContent = data.error || 'Could not create code.';
          return;
        }
        msgEl.textContent = `Code: ${data.accessCode.code}`;
        document.getElementById('new-code-input').value = '';
      } catch (e) {
        msgEl.textContent = 'Error creating code.';
      }
    });

    document.getElementById('access-code-submit').addEventListener('click', async () => {
      const code = document.getElementById('access-code-input').value.trim();
      const msgEl = document.getElementById('access-code-msg');
      msgEl.className = 'status-msg';
      try {
        const res = await fetch('/api/access-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (!res.ok || !data.token) {
          msgEl.textContent = data.error || 'Invalid access code.';
          return;
        }
        setToken(data.token);
        msgEl.textContent = 'Unlocked!';
        msgEl.className = 'status-msg ok-msg';
      } catch (e) {
        msgEl.textContent = 'Error checking access code.';
      }
    });

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('upload-msg');
      const token = getToken();
      const fileInput = document.getElementById('upload-file');
      const titleInput = document.getElementById('upload-title');
      const descInput = document.getElementById('upload-desc');

      msgEl.className = 'status-msg';
      if (!token) {
        msgEl.textContent = 'Sign in first.';
        return;
      }
      if (!fileInput.files.length) {
        msgEl.textContent = 'Choose a video file first.';
        return;
      }

      const fd = new FormData();
      fd.append('title', titleInput.value.trim());
      fd.append('description', descInput.value.trim());
      fd.append('video', fileInput.files[0]);

      msgEl.textContent = 'Uploading...';
      try {
        const res = await fetch('/api/videos', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body: fd,
        });
        const data = await res.json();
        if (!res.ok) {
          msgEl.textContent = data.error || 'Upload failed.';
          return;
        }
        msgEl.textContent = `Uploaded: ${data.video.title}`;
        msgEl.className = 'status-msg ok-msg';
        e.target.reset();
        loadVideos();
      } catch (err) {
        msgEl.textContent = 'Upload failed.';
      }
    });

    async function loadVideos() {
      const listEl = document.getElementById('videos-list');
      const q = encodeURIComponent(document.getElementById('search-input').value.trim());
      const token = getToken();
      try {
        const res = await fetch(`/api/videos?sort=${encodeURIComponent(currentSort)}&q=${q}`, {
          headers: token ? { Authorization: `Bearer ${token}` } : {},
        });
        const videos = await res.json();
        if (!Array.isArray(videos) || videos.length === 0) {
          listEl.innerHTML = '<div class="muted">No videos yet.</div>';
          return;
        }
        listEl.innerHTML = videos.map((v) => {
          const isLocked = Boolean(v.locked) || !v.url;
          if (isLocked) {
            return `
              <div class="video-card">
                <strong>${escapeHtml(v.title)}</strong>
                ${v.description ? `<div class="muted">${escapeHtml(v.description)}</div>` : ''}
                <div class="video-stage locked-preview" data-locked-title="${escapeHtml(v.title)}">
                  <div class="lock-layer">
                    <span class="lock-badge">ACCESS CODE REQUIRED</span>
                    <div class="muted">Locked video</div>
                    <button type="button" class="contact-link request-code-trigger" data-title="${escapeHtml(v.title)}">
                      Message to request an access code
                    </button>
                  </div>
                </div>
              </div>
            `;
          }
          return `
            <div class="video-card">
              <strong>${escapeHtml(v.title)}</strong>
              ${v.description ? `<div class="muted">${escapeHtml(v.description)}</div>` : ''}
              <div class="video-stage">
                <video controls preload="metadata" src="${escapeHtml(v.url)}"></video>
              </div>
            </div>
          `;
        }).join('');

        listEl.querySelectorAll('.locked-preview').forEach((stage) => {
          stage.addEventListener('click', () => {
            openContactModal(stage.dataset.lockedTitle || '');
          });
        });
      } catch (e) {
        listEl.innerHTML = '<div class="muted">Could not load videos.</div>';
      }
    }

    async function loadChat() {
      const box = document.getElementById('chat-messages');
      try {
        const res = await fetch('/api/chat');
        const msgs = await res.json();
        if (!Array.isArray(msgs) || msgs.length === 0) {
          box.innerHTML = '<div class="muted">No messages yet.</div>';
          return;
        }
        box.innerHTML = msgs.map((m) => `
          <div class="msg">
            <div class="msg-meta">
              <span class="${m.role === 'owner' ? 'badge-owner' : ''}">${escapeHtml(m.sender)}</span>
              · ${new Date(m.created_at).toLocaleTimeString()}
            </div>
            <div>${escapeHtml(m.message)}</div>
          </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
      } catch (e) {
        box.innerHTML = '<div class="muted">Chat unavailable.</div>';
      }
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('chat-msg');
      const sender = document.getElementById('chat-sender').value.trim() || 'Visitor';
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      msgEl.textContent = '';
      if (!message) return;

      try {
        await sendChatMessage(sender, message);
        input.value = '';
      } catch (err) {
        msgEl.textContent = err.message;
      }
    });

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentSort = btn.dataset.sort;
        loadVideos();
      });
    });

    document.getElementById('search-input').addEventListener('input', () => {
      loadVideos();
    });

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    updateViewState();
    loadVideos();
    loadChat();
    setInterval(loadChat, 4000);
  </script>
</body>
</html>
