<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reba</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0c1712;
      color: #eef5f0;
      min-height: 100vh;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 18px 16px 64px; }
    .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
    .brand { font-size: 20px; font-weight: 700; color: #fff; text-decoration: none; margin-right: 4px; }
    .search { flex: 1; min-width: 180px; background: #14241c; border: 1px solid #264234; color: #fff; padding: 9px 12px; border-radius: 999px; font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
    button, .btn {
      background: #1b2e24;
      color: #e6f2eb;
      border: 1px solid #2f5240;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: #36b368; color: #07140c; border-color: #36b368; }
    button.danger { background: #3a171b; color: #ff9aa2; border-color: #6e272f; padding: 5px 10px; font-size: 12px; }
    button.ghost { background: transparent; border-color: #264234; color: #a9c4b5; }
    button.active-tab { background: #264234; color: #fff; border-color: #487a60; }
    .card {
      background: #122119;
      border: 1px solid #223b2e;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h2, h3 { margin: 0 0 10px; font-size: 17px; }
    label { display: block; font-size: 12px; color: #9ab5a6; margin: 10px 0 4px; }
    input, textarea {
      width: 100%;
      background: #0b1410;
      border: 1px solid #294738;
      color: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea { min-height: 80px; resize: vertical; }
    .msg-err { color: #ff8a93; font-size: 13px; margin-top: 8px; }
    .msg-ok { color: #5ce08e; font-size: 13px; margin-top: 8px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .video-tile { background: #122119; border: 1px solid #223b2e; border-radius: 14px; padding: 14px; cursor: pointer; }
    .video-tile:hover { border-color: #36b368; }
    .meta { font-size: 12px; color: #8da899; margin-top: 6px; }
    video { width: 100%; border-radius: 12px; background: #000; max-height: 440px; }
    .comment { border-top: 1px solid #1e3529; padding: 10px 0; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .comment:first-child { border-top: none; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #182b21; font-size: 12px; color: #a9d5ba; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="#" onclick="showHome(); return false;">&#9654; Reba</a>
      <input id="searchInput" class="search" type="search" placeholder="Search videos" oninput="loadVideos()" />
    </div>

    <div class="actions">
      <button id="btnUnlock" class="primary" onclick="openAuthModal('register')">Create account / Sign in</button>
      <button id="btnContact" onclick="openContactModal()">Contact owner</button>
      <span id="userBadge" class="pill hidden"></span>
      <button id="btnUploadToggle" class="hidden" onclick="toggleUpload()">Upload video</button>
      <button id="btnOwnerPanelToggle" class="hidden" onclick="toggleOwnerPanel()">Owner panel</button>
      <button id="btnLogout" class="ghost hidden" onclick="logout()">Log out</button>
    </div>

    <!-- Auth Card (Create Account, User Sign In, Access Code, Owner Login) -->
    <div id="authCard" class="card hidden">
      <div class="tabs">
        <button id="tabRegister" class="active-tab" onclick="switchAuthTab('register')">Create account</button>
        <button id="tabLogin" class="ghost" onclick="switchAuthTab('login')">User sign in</button>
        <button id="tabCode" class="ghost" onclick="switchAuthTab('code')">Access code</button>
        <button id="tabOwner" class="ghost" onclick="switchAuthTab('owner')">Owner login</button>
      </div>

      <form id="formRegister" onsubmit="submitRegister(event)">
        <h2>Create an account</h2>
        <label>Username</label>
        <input id="regUsername" type="text" placeholder="3-30 chars (letters, numbers, ._ -)" required />
        <label>Password</label>
        <input id="regPassword" type="password" placeholder="At least 6 characters" required />
        <div style="margin-top:12px; display:flex; gap:8px;">
          <button type="submit" class="primary">Create account</button>
          <button type="button" class="ghost" onclick="closeAuthModal()">Close</button>
        </div>
      </form>

      <form id="formLogin" class="hidden" onsubmit="submitLogin(event)">
        <h2>Sign in</h2>
        <label>Username</label>
        <input id="loginUsername" type="text" required />
        <label>Password</label>
        <input id="loginPassword" type="password" required />
        <div style="margin-top:12px; display:flex; gap:8px;">
          <button type="submit" class="primary">Sign in</button>
          <button type="button" class="ghost" onclick="closeAuthModal()">Close</button>
        </div>
      </form>

      <form id="formCode" class="hidden" onsubmit="submitCode(event)">
        <h2>Redeem access code</h2>
        <label>Access code</label>
        <input id="codeInput" type="text" placeholder="XXXXX-XXXXX" required />
        <div style="margin-top:12px; display:flex; gap:8px;">
          <button type="submit" class="primary">Unlock</button>
          <button type="button" class="ghost" onclick="closeAuthModal()">Close</button>
        </div>
      </form>

      <form id="formOwner" class="hidden" onsubmit="submitOwnerLogin(event)">
        <h2>Owner login</h2>
        <label>Owner password</label>
        <input id="ownerPassword" type="password" placeholder="Owner password" required />
        <div style="margin-top:12px; display:flex; gap:8px;">
          <button type="submit" class="primary">Log in</button>
          <button type="button" class="ghost" onclick="closeAuthModal()">Close</button>
        </div>
      </form>

      <div id="authMsg"></div>
    </div>

    <!-- Contact Card -->
    <div id="contactCard" class="card hidden">
      <h2>Contact owner</h2>
      <form onsubmit="submitContact(event)">
        <label>Your name</label>
        <input id="cName" type="text" required />
        <label>How to reach you</label>
        <input id="cContact" type="text" required />
        <label>Message</label>
        <textarea id="cBody" required></textarea>
        <div style="margin-top:12px; display:flex; gap:8px;">
          <button type="submit" class="primary">Send message</button>
          <button type="button" class="ghost" onclick="closeContactModal()">Close</button>
        </div>
      </form>
      <div id="contactMsg"></div>
    </div>

    <!-- Upload Card -->
    <div id="uploadCard" class="card hidden">
      <h2>Upload video</h2>
      <form onsubmit="submitUpload(event)">
        <label>Title</label>
        <input id="vTitle" type="text" required />
        <label>Description</label>
        <textarea id="vDescr"></textarea>
        <label>Video file</label>
        <input id="vFile" type="file" accept="video/*" required />
        <div style="margin-top:12px; display:flex; gap:8px;">
          <button type="submit" class="primary">Upload</button>
          <button type="button" class="ghost" onclick="toggleUpload(false)">Cancel</button>
        </div>
      </form>
      <div id="uploadMsg"></div>
    </div>

    <!-- Owner Panel -->
    <div id="ownerPanel" class="card hidden">
      <h2>Owner panel</h2>
      <form onsubmit="createCode(event)" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
        <input id="codeLabel" type="text" placeholder="Label for new invite code" style="flex:1; min-width:180px;" required />
        <button type="submit" class="primary">Generate code</button>
      </form>
      <div id="codesList" class="meta"></div>
      <h3 style="margin-top:16px;">Messages</h3>
      <div id="messagesList" class="meta"></div>
    </div>

    <!-- Active Video Player & Comments -->
    <div id="playerCard" class="card hidden">
      <button class="ghost" style="margin-bottom:10px;" onclick="closePlayer()">&larr; Back to videos</button>
      <video id="videoPlayer" controls controlsList="nodownload"></video>
      <h2 id="pTitle" style="margin-top:12px;"></h2>
      <div id="pMeta" class="meta"></div>
      <p id="pDescr" style="white-space:pre-wrap; margin:10px 0;"></p>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
        <button id="btnLike" onclick="toggleLike()">Like (<span id="likeCount">0</span>)</button>
        <button id="btnDeleteVideo" class="danger hidden" onclick="deleteVideo()">Delete video</button>
      </div>

      <h3>Comments</h3>
      <form onsubmit="postComment(event)" style="display:flex; gap:8px; margin-bottom:12px;">
        <input id="commentInput" type="text" placeholder="Write a comment..." required />
        <button type="submit" class="primary">Post</button>
      </form>
      <div id="commentsList"></div>
    </div>

    <!-- Video Feed -->
    <div id="feedSection">
      <div id="videoGrid" class="video-grid"></div>
    </div>
  </div>

  <script>
    let me = null;
    let currentVideoId = null;

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    async function api(url, opts = {}) {
      const res = await fetch(url, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed.');
      return data;
    }

    async function refreshMe() {
      me = await api('/api/me');
      const isLoggedIn = !!me;
      const isAdmin = me && me.role === 'admin';
      document.getElementById('btnUnlock').classList.toggle('hidden', isLoggedIn);
      document.getElementById('btnLogout').classList.toggle('hidden', !isLoggedIn);
      document.getElementById('btnUploadToggle').classList.toggle('hidden', !isLoggedIn);
      document.getElementById('btnOwnerPanelToggle').classList.toggle('hidden', !isAdmin);
      document.getElementById('btnDeleteVideo').classList.toggle('hidden', !isAdmin);
      const badge = document.getElementById('userBadge');
      if (isLoggedIn) {
        badge.textContent = `${me.name} (${me.role})`;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
        document.getElementById('ownerPanel').classList.add('hidden');
        document.getElementById('uploadCard').classList.add('hidden');
      }
      if (currentVideoId) openVideo(currentVideoId, true);
    }

    function openAuthModal(tab = 'register') {
      document.getElementById('authCard').classList.remove('hidden');
      document.getElementById('contactCard').classList.add('hidden');
      switchAuthTab(tab);
    }
    function closeAuthModal() {
      document.getElementById('authCard').classList.add('hidden');
      document.getElementById('authMsg').innerHTML = '';
    }
    function switchAuthTab(tab) {
      for (const t of ['register', 'login', 'code', 'owner']) {
        document.getElementById('form' + t[0].toUpperCase() + t.slice(1)).classList.toggle('hidden', t !== tab);
        document.getElementById('tab' + t[0].toUpperCase() + t.slice(1)).className = (t === tab) ? 'active-tab' : 'ghost';
      }
      document.getElementById('authMsg').innerHTML = '';
    }

    async function submitRegister(e) {
      e.preventDefault();
      try {
        await api('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('regUsername').value,
            password: document.getElementById('regPassword').value,
          }),
        });
        closeAuthModal();
        await refreshMe();
      } catch (err) {
        document.getElementById('authMsg').innerHTML = `<div class="msg-err">${esc(err.message)}</div>`;
      }
    }

    async function submitLogin(e) {
      e.preventDefault();
      try {
        await api('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginUsername').value,
            password: document.getElementById('loginPassword').value,
          }),
        });
        closeAuthModal();
        await refreshMe();
      } catch (err) {
        document.getElementById('authMsg').innerHTML = `<div class="msg-err">${esc(err.message)}</div>`;
      }
    }

    async function submitCode(e) {
      e.preventDefault();
      try {
        await api('/api/redeem', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: document.getElementById('codeInput').value }),
        });
        closeAuthModal();
        await refreshMe();
      } catch (err) {
        document.getElementById('authMsg').innerHTML = `<div class="msg-err">${esc(err.message)}</div>`;
      }
    }

    async function submitOwnerLogin(e) {
      e.preventDefault();
      try {
        await api('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('ownerPassword').value }),
        });
        closeAuthModal();
        await refreshMe();
      } catch (err) {
        document.getElementById('authMsg').innerHTML = `<div class="msg-err">${esc(err.message)}</div>`;
      }
    }

    async function logout() {
      await api('/api/logout', { method: 'POST' });
      await refreshMe();
    }

    function openContactModal() {
      document.getElementById('contactCard').classList.remove('hidden');
      document.getElementById('authCard').classList.add('hidden');
    }
    function closeContactModal() {
      document.getElementById('contactCard').classList.add('hidden');
      document.getElementById('contactMsg').innerHTML = '';
    }
    async function submitContact(e) {
      e.preventDefault();
      try {
        await api('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('cName').value,
            contact: document.getElementById('cContact').value,
            message: document.getElementById('cBody').value,
          }),
        });
        document.getElementById('contactMsg').innerHTML = '<div class="msg-ok">Message sent.</div>';
        e.target.reset();
      } catch (err) {
        document.getElementById('contactMsg').innerHTML = `<div class="msg-err">${esc(err.message)}</div>`;
      }
    }

    function toggleUpload(force) {
      const el = document.getElementById('uploadCard');
      el.classList.toggle('hidden', force !== undefined ? !force : !el.classList.contains('hidden'));
    }

    async function submitUpload(e) {
      e.preventDefault();
      const fd = new FormData();
      fd.append('title', document.getElementById('vTitle').value);
      fd.append('descr', document.getElementById('vDescr').value);
      fd.append('video', document.getElementById('vFile').files[0]);
      try {
        await api('/api/videos', { method: 'POST', body: fd });
        document.getElementById('uploadMsg').innerHTML = '<div class="msg-ok">Uploaded!</div>';
        e.target.reset();
        await loadVideos();
      } catch (err) {
        document.getElementById('uploadMsg').innerHTML = `<div class="msg-err">${esc(err.message)}</div>`;
      }
    }

    async function loadVideos() {
      const q = encodeURIComponent(document.getElementById('searchInput').value || '');
      const list = await api(`/api/videos?q=${q}`);
      const grid = document.getElementById('videoGrid');
      if (!list.length) {
        grid.innerHTML = '<div class="meta">No videos yet.</div>';
        return;
      }
      grid.innerHTML = list.map(v => `
        <div class="video-tile" onclick="openVideo(${v.id})">
          <div style="font-weight:700;">${esc(v.title)}</div>
          <div class="meta">by ${esc(v.author || 'Member')} &middot; ${v.views} views &middot; ${v.likes} likes</div>
        </div>
      `).join('');
    }

    async function openVideo(id, noview = false) {
      currentVideoId = id;
      try {
        const v = await api(`/api/videos/${id}${noview ? '?noview=1' : ''}`);
        document.getElementById('playerCard').classList.remove('hidden');
        document.getElementById('pTitle').textContent = v.title;
        document.getElementById('pMeta').textContent = `by ${v.author || 'Member'} · ${v.views} views`;
        document.getElementById('pDescr').textContent = v.descr || '';
        document.getElementById('likeCount').textContent = v.likes;
        document.getElementById('btnDeleteVideo').classList.toggle('hidden', !(me && me.role === 'admin'));
        const player = document.getElementById('videoPlayer');
        if (!noview) player.src = `/stream/${id}`;
        renderComments(v.comments || []);
      } catch (err) {
        openAuthModal('register');
        document.getElementById('authMsg').innerHTML = `<div class="msg-err">${esc(err.message)}</div>`;
      }
    }

    function closePlayer() {
      currentVideoId = null;
      document.getElementById('videoPlayer').pause();
      document.getElementById('videoPlayer').removeAttribute('src');
      document.getElementById('playerCard').classList.add('hidden');
      loadVideos();
    }

    function showHome() {
      closePlayer();
      document.getElementById('authCard').classList.add('hidden');
      document.getElementById('contactCard').classList.add('hidden');
    }

    async function toggleLike() {
      if (!currentVideoId) return;
      try {
        const r = await api(`/api/videos/${currentVideoId}/like`, { method: 'POST' });
        document.getElementById('likeCount').textContent = r.likes;
      } catch (err) {
        alert(err.message);
      }
    }

    async function postComment(e) {
      e.preventDefault();
      if (!currentVideoId) return;
      const body = document.getElementById('commentInput').value;
      try {
        await api(`/api/videos/${currentVideoId}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body }),
        });
        document.getElementById('commentInput').value = '';
        await openVideo(currentVideoId, true);
      } catch (err) {
        alert(err.message);
      }
    }

    function renderComments(comments) {
      const isAdmin = me && me.role === 'admin';
      const box = document.getElementById('commentsList');
      if (!comments.length) {
        box.innerHTML = '<div class="meta">No comments yet.</div>';
        return;
      }
      box.innerHTML = comments.map(c => `
        <div class="comment">
          <div>
            <div style="font-weight:600; font-size:13px;">${esc(c.author || 'Member')}</div>
            <div style="margin-top:4px; font-size:14px;">${esc(c.body)}</div>
          </div>
          ${isAdmin ? `<button class="danger" onclick="deleteComment(${c.id})">Delete</button>` : ''}
        </div>
      `).join('');
    }

    async function deleteComment(commentId) {
      try {
        await api(`/api/comments/${commentId}`, { method: 'DELETE' });
        if (currentVideoId) await openVideo(currentVideoId, true);
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteVideo() {
      if (!currentVideoId) return;
      try {
        await api(`/api/videos/${currentVideoId}`, { method: 'DELETE' });
        closePlayer();
      } catch (err) {
        alert(err.message);
      }
    }

    async function toggleOwnerPanel() {
      const panel = document.getElementById('ownerPanel');
      const show = panel.classList.contains('hidden');
      panel.classList.toggle('hidden', !show);
      if (show) await loadOwnerData();
    }

    async function loadOwnerData() {
      const [codes, msgs] = await Promise.all([api('/api/admin/codes'), api('/api/admin/messages')]);
      document.getElementById('codesList').innerHTML = codes.map(c =>
        `<div style="margin:4px 0;"><b>${esc(c.code)}</b> — ${esc(c.label)}</div>`
      ).join('') || 'No codes yet.';
      document.getElementById('messagesList').innerHTML = msgs.map(m =>
        `<div style="margin:6px 0;"><b>${esc(m.name)}</b> (${esc(m.contact)}): ${esc(m.body)}</div>`
      ).join('') || 'No messages yet.';
    }

    async function createCode(e) {
      e.preventDefault();
      await api('/api/admin/codes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: document.getElementById('codeLabel').value }),
      });
      document.getElementById('codeLabel').value = '';
      await loadOwnerData();
    }

    (async () => {
      await refreshMe();
      await loadVideos();
    })();
  </script>
</body>
</html>
