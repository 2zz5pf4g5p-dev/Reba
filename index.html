<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REBA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand {
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #ef4444;
      font-size: 1.2rem;
      white-space: nowrap;
    }
    input, textarea, button, select {
      font: inherit;
      border-radius: 10px;
      border: 1px solid #27272a;
      background: #141418;
      color: #f4f4f5;
      padding: 10px 12px;
    }
    input[type="search"], input[type="text"], input[type="password"] {
      width: 100%;
    }
    .btn {
      cursor: pointer;
      font-weight: 700;
      border: none;
    }
    .btn-red {
      background: #dc2626;
      color: #fff;
    }
    .btn-dark {
      background: #18181b;
      color: #f4f4f5;
      border: 1px solid #2e2e36;
    }
    .panel {
      background: #111115;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin: 12px 0;
      flex-wrap: wrap;
    }
    .tab.active {
      background: #dc2626;
      color: #fff;
      border-color: #dc2626;
    }
    .video-card {
      background: #111115;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      margin-top: 8px;
    }
    .chat-box {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      background: #0b0b0e;
      border: 1px solid #222228;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .msg {
      padding: 8px 10px;
      border-radius: 10px;
      background: #16161c;
      font-size: 0.92rem;
    }
    .msg-meta {
      font-size: 0.76rem;
      color: #a1a1aa;
      margin-bottom: 3px;
    }
    .badge-owner {
      color: #f87171;
      font-weight: 700;
    }
    .muted {
      color: #a1a1aa;
      font-size: 0.88rem;
    }
    .hidden {
      display: none;
    }
    .status-msg {
      font-size: 0.88rem;
      margin-top: 6px;
      color: #fca5a5;
    }
    .ok-msg {
      color: #86efac;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">&#9654; REBA</div>
      <input type="search" id="search-input" placeholder="Search videos" />
    </div>

    <div class="panel stack">
      <div class="row">
        <button class="btn btn-red" id="open-owner-btn" type="button">OWNER LOGIN / UPLOAD</button>
        <button class="btn btn-dark" id="open-code-btn" type="button">ENTER ACCESS CODE</button>
        <button class="btn btn-dark" id="toggle-chat-btn" type="button">IN-APP CHAT</button>
      </div>
      <div id="owner-status-bar" class="muted">Status: Guest view (log in as owner to upload videos)</div>
    </div>

    <!-- Owner Login Box -->
    <div class="panel stack" id="owner-login-panel">
      <strong>OWNER LOGIN</strong>
      <input type="password" id="owner-password-input" placeholder="Enter OWNER PASSWORD" autocomplete="current-password" />
      <div class="row">
        <button class="btn btn-red" id="owner-login-submit" type="button">LOG IN</button>
        <button class="btn btn-dark" id="owner-logout-btn" type="button">LOG OUT</button>
      </div>
      <div id="owner-login-msg" class="status-msg"></div>
    </div>

    <!-- Upload Video Box (Always visible in UI so you can find it immediately, requires Owner login to post) -->
    <div class="panel stack" id="upload-panel">
      <strong>UPLOAD VIDEO</strong>
      <form id="upload-form" class="stack" enctype="multipart/form-data">
        <input type="text" id="upload-title" name="title" placeholder="Video title" required />
        <input type="text" id="upload-desc" name="description" placeholder="Description (optional)" />
        <input type="file" id="upload-file" name="video" accept="video/*" required />
        <button class="btn btn-red" type="submit">UPLOAD VIDEO</button>
      </form>
      <div id="upload-msg" class="status-msg"></div>
    </div>

    <!-- Access Code Box -->
    <div class="panel stack hidden" id="code-panel">
      <strong>ACCESS CODE</strong>
      <input type="text" id="access-code-input" placeholder="Enter access code" />
      <button class="btn btn-red" id="access-code-submit" type="button">UNLOCK</button>
      <div id="access-code-msg" class="status-msg"></div>
    </div>

    <!-- In-App Chat -->
    <div class="panel stack" id="chat-panel">
      <div class="row" style="justify-content: space-between;">
        <strong>IN-APP CHAT</strong>
        <span class="muted" id="chat-sync-label">Live sync</span>
      </div>
      <div class="chat-box" id="chat-messages">
        <div class="muted">Loading messages...</div>
      </div>
      <form id="chat-form" class="stack">
        <input type="text" id="chat-sender" placeholder="Your name (optional)" />
        <div class="row">
          <input type="text" id="chat-input" placeholder="Type a message..." style="flex: 1;" required />
          <button class="btn btn-red" type="submit">SEND</button>
        </div>
      </form>
      <div id="chat-msg" class="status-msg"></div>
    </div>

    <!-- Video Feed -->
    <div class="tabs">
      <button class="btn btn-dark tab active" data-sort="new" type="button">NEW</button>
      <button class="btn btn-dark tab" data-sort="views" type="button">MOST VIEWED</button>
      <button class="btn btn-dark tab" data-sort="likes" type="button">MOST LIKED</button>
    </div>

    <div id="videos-list">
      <div class="muted">Loading videos...</div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = 'reba_owner_token';
    let currentSort = 'new';

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || '';
    }

    function setToken(token) {
      if (token) localStorage.setItem(TOKEN_KEY, token);
      else localStorage.removeItem(TOKEN_KEY);
      updateAuthUI();
    }

    function updateAuthUI() {
      const hasOwner = Boolean(getToken());
      const bar = document.getElementById('owner-status-bar');
      bar.textContent = hasOwner
        ? 'Status: Logged in as OWNER — video upload unlocked'
        : 'Status: Guest view — log in as OWNER above before uploading';
    }

    async function doOwnerLogin() {
      const msgEl = document.getElementById('owner-login-msg');
      const pw = document.getElementById('owner-password-input').value;
      msgEl.textContent = 'Logging in...';
      msgEl.className = 'status-msg';

      try {
        const res = await fetch('/api/owner/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        const data = await res.json();
        if (!res.ok || !data.token) {
          msgEl.textContent = data.error || 'Login failed.';
          return;
        }
        setToken(data.token);
        msgEl.textContent = 'Owner logged in.';
        msgEl.className = 'status-msg ok-msg';
      } catch (err) {
        msgEl.textContent = 'Connection error while logging in.';
      }
    }

    document.getElementById('owner-login-submit').addEventListener('click', doOwnerLogin);
    document.getElementById('owner-logout-btn').addEventListener('click', () => {
      setToken('');
      document.getElementById('owner-login-msg').textContent = 'Logged out.';
    });

    document.getElementById('open-owner-btn').addEventListener('click', () => {
      document.getElementById('owner-login-panel').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('open-code-btn').addEventListener('click', () => {
      document.getElementById('code-panel').classList.toggle('hidden');
    });

    document.getElementById('toggle-chat-btn').addEventListener('click', () => {
      document.getElementById('chat-panel').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('access-code-submit').addEventListener('click', async () => {
      const code = document.getElementById('access-code-input').value.trim();
      const msgEl = document.getElementById('access-code-msg');
      msgEl.className = 'status-msg';
      try {
        const res = await fetch('/api/access-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        msgEl.textContent = data.ok ? 'Access code verified!' : (data.error || 'Invalid code');
        if (data.ok) msgEl.className = 'status-msg ok-msg';
      } catch (e) {
        msgEl.textContent = 'Error checking access code.';
      }
    });

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('upload-msg');
      const token = getToken();
      const fileInput = document.getElementById('upload-file');
      const titleInput = document.getElementById('upload-title');
      const descInput = document.getElementById('upload-desc');

      msgEl.className = 'status-msg';

      if (!token) {
        msgEl.textContent = 'Log in with OWNER PASSWORD first.';
        return;
      }
      if (!fileInput.files.length) {
        msgEl.textContent = 'Choose a video file first.';
        return;
      }

      const fd = new FormData();
      fd.append('title', titleInput.value.trim());
      fd.append('description', descInput.value.trim());
      fd.append('video', fileInput.files[0]);

      msgEl.textContent = 'Uploading video...';
      try {
        const res = await fetch('/api/videos', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body: fd,
        });
        const data = await res.json();
        if (!res.ok) {
          msgEl.textContent = data.error || 'Upload failed.';
          return;
        }
        msgEl.textContent = `Uploaded: ${data.video.title}`;
        msgEl.className = 'status-msg ok-msg';
        e.target.reset();
        loadVideos();
      } catch (err) {
        msgEl.textContent = 'Upload failed due to network error.';
      }
    });

    async function loadVideos() {
      const listEl = document.getElementById('videos-list');
      const q = encodeURIComponent(document.getElementById('search-input').value.trim());
      try {
        const res = await fetch(`/api/videos?sort=${encodeURIComponent(currentSort)}&q=${q}`);
        const videos = await res.json();
        if (!Array.isArray(videos) || videos.length === 0) {
          listEl.innerHTML = '<div class="muted">No videos yet.</div>';
          return;
        }
        listEl.innerHTML = videos.map((v) => `
          <div class="video-card">
            <strong>${escapeHtml(v.title)}</strong>
            ${v.description ? `<div class="muted">${escapeHtml(v.description)}</div>` : ''}
            <video controls preload="metadata" src="${escapeHtml(v.url)}"></video>
          </div>
        `).join('');
      } catch (e) {
        listEl.innerHTML = '<div class="muted">Could not load videos.</div>';
      }
    }

    async function loadChat() {
      const box = document.getElementById('chat-messages');
      try {
        const res = await fetch('/api/chat');
        const msgs = await res.json();
        if (!Array.isArray(msgs) || msgs.length === 0) {
          box.innerHTML = '<div class="muted">No chat messages yet. Start the conversation below.</div>';
          return;
        }
        box.innerHTML = msgs.map((m) => `
          <div class="msg">
            <div class="msg-meta">
              <span class="${m.role === 'owner' ? 'badge-owner' : ''}">${escapeHtml(m.sender)}</span>
              · ${new Date(m.created_at).toLocaleTimeString()}
            </div>
            <div>${escapeHtml(m.message)}</div>
          </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
      } catch (e) {
        box.innerHTML = '<div class="muted">Chat unavailable.</div>';
      }
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('chat-msg');
      const sender = document.getElementById('chat-sender').value.trim() || 'Guest';
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      msgEl.textContent = '';
      if (!message) return;

      const token = getToken();
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
          },
          body: JSON.stringify({ sender, message }),
        });
        const data = await res.json();
        if (!res.ok) {
          msgEl.textContent = data.error || 'Could not send message.';
          return;
        }
        input.value = '';
        loadChat();
      } catch (err) {
        msgEl.textContent = 'Network error sending message.';
      }
    });

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentSort = btn.dataset.sort;
        loadVideos();
      });
    });

    document.getElementById('search-input').addEventListener('input', () => {
      loadVideos();
    });

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    updateAuthUI();
    loadVideos();
    loadChat();
    setInterval(loadChat, 4000);
  </script>
</body>
</html>
